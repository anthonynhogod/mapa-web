{% extends "base.html" %}
{% block title %}Principal{% endblock %}
{% block main %}
<div class="menu-lateral">
    <!-- Itens principais do menu lateral -->
    <a class="item-menu" href="{{ url_for('admin.index') }}">
        <i class="fa fa-home"></i>
        <span>Início</span>
    </a>
    <div class="dropdown">
        <a class="item-menu dropdown-toggle" href="#">
            <i class="fas fa-users"></i>
            <span>Usuários</span>
            <i class="fa fa-chevron-down arrow"></i>
        </a>
        <ul class="dropdown-menu">
            <li><a class="sub-item" href="{{ url_for('admin.users') }}">Gerenciar</a></li>
            <li><a class="sub-item" href="{{ url_for('admin.usuario_novo') }}">Novo</a></li>
        </ul>
    </div>

    <!-- Dropdown para Registros -->
    <div class="dropdown">
        <a class="item-menu dropdown-toggle" href="#">
            <i class="far fa-file"></i>
            <span>Logs</span>
            <i class="fa fa-chevron-down arrow"></i>
        </a>
        <ul class="dropdown-menu">
            <li><a class="sub-item" href="{{ url_for('admin.audits') }}">Geral</a></li>
        </ul>
    </div>

    <a class="item-menu" href="{{ url_for('public.main') }}">
        <i class="fa fa-list"></i>
        <span>Registros</span>
    </a>
    <a class="item-menu" href="{{ url_for('admin.constantes') }}">
        <i class="fa fa-table"></i>
        <span>Constantes</span>
    </a>
    <!-- Dropdown para Configurações -->
    <div class="dropdown">
        <a class="item-menu dropdown-toggle" href="#">
            <i class="fa fa-cog"></i>
            <span>Configurações</span>
            <i class="fa fa-chevron-down arrow"></i>
        </a>
        <ul class="dropdown-menu">
            <li><a class="sub-item" href="{{ url_for('admin.threads') }}">Threads</a></li>
        </ul>
    </div>
</div>

<section class="painel">
    <!-- Nova seção: Outras Informações (liberação da área dos atalhos antigos) -->
    <div class="outras-informacoes">
        {% block content %}
        {% endblock %}
    </div>
</section>


<!-- JavaScript para toggle dos dropdowns -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const dropdownToggles = document.querySelectorAll('.dropdown-toggle');

        dropdownToggles.forEach(toggle => {
            toggle.addEventListener('click', function (e) {
                e.preventDefault(); // Impede navegação se o link tiver href="#"
                const dropdown = this.parentElement;
                const isOpen = dropdown.classList.contains('open');

                // Fecha todos os outros dropdowns abertos
                document.querySelectorAll('.dropdown.open').forEach(openDropdown => {
                    if (openDropdown !== dropdown) {
                        openDropdown.classList.remove('open');
                    }
                });

                // Toggle o dropdown atual
                if (isOpen) {
                    dropdown.classList.remove('open');
                } else {
                    dropdown.classList.add('open');
                }
            });
        });
    });
</script>
{% endblock %}
