{% extends 'base.html' %}
{% block titulo %}Detalhes do Produto{% endblock %}
{% block conteudo %}
<h1>{{ produto.nome }}</h1>
<p><strong>Preço:</strong> R$ {{ produto.preco }}</p>
<p><strong>Imagem:</strong> <img src="{{ produto.imagem }}" width="200"></p>
<p><strong>ID da Empresa:</strong> {{ produto.id_empresa }}</p>
<a href="{{ url_for('produtos') }}">← Voltar</a>
{% endblock %}
